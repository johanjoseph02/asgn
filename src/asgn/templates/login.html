{% extends "base.html" %}
{% block title %}Sign in · Asgn{% endblock %}
{% block main %}
<div class="login card">
  <h1>Asgn</h1>
  <p class="sub">See the coursework landing on every group of students, and keep it from piling up.</p>
  {% if error %}<p class="notice" role="alert">Wrong email or password.</p>{% endif %}
  <form method="post" action="/login">
    <label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email">
    <label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password">
    <p><button class="primary" type="submit">Sign in</button></p>
  </form>
</div>
{% endblock %}
